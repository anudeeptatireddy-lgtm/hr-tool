<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Tool</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><div class="logo">HR</div>HR Tool</div>
    <nav id="nav">
      <a href="#/" data-r="dash"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
      <a href="#/jobs" data-r="jobs"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></svg>Jobs</a>
      <a href="#/candidates" data-r="candidates"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.1 2.5 3.5 5.2"/></svg>Candidates</a>

      <a href="#/backtest" data-r="backtest"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Back-test</a>
    </nav>
    <div class="aside-foot">Demo mode: emails go to your own inbox, never to candidates.</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <input class="search" id="search" placeholder="Search candidates…" autocomplete="off">
      <div class="user"><div class="avatar">AM</div>Arjun M.</div>
    </div>
    <div class="content" id="view"><div class="empty"><span class="spinner"></span>Loading…</div></div>
  </div>
</div>
<div id="modal"></div>
<script src="/app.js"></script>
</body>
</html>
